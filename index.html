<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결혼기념일 축하합니다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    font-family: 'Gowun Dodum', sans-serif;
    background: #ffffff;
    color: #444;
  }

  .screen {
    display: none;
    min-height: 100vh;
    width: 100%;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    animation: fadeIn .6s ease;
  }
  .screen.active { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* 화면 1: 날짜 입력 */
  #screen-date h1 {
    font-size: 1.5rem;
    font-weight: 400;
    margin-bottom: 32px;
    color: #333;
  }
  #date-input {
    padding: 14px 18px;
    border-radius: 14px;
    border: 2px solid #ffd1da;
    font-size: 1.05rem;
    font-family: inherit;
    color: #555;
    outline: none;
    margin-bottom: 24px;
  }
  #date-input:focus { border-color: #ff8fa3; }

  .btn-primary {
    padding: 14px 40px;
    border-radius: 999px;
    background: linear-gradient(135deg, #ff8fa3, #ff6b81);
    color: #fff;
    border: none;
    font-size: 1.05rem;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(255, 107, 129, 0.35);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255, 107, 129, 0.45);
  }
  .btn-primary:active { transform: translateY(0); }

  /* 화면 2: 이름 확인 메시지 */
  #transition-message {
    font-size: 1.7rem;
    color: #ff4d6d;
    font-family: 'Do Hyeon', sans-serif;
    animation: popIn .5s ease;
  }
  @keyframes popIn {
    0% { opacity: 0; transform: scale(.8); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* 화면 3: 질문 */
  #screen-question h1 {
    font-size: 1.4rem;
    font-weight: 400;
    margin-bottom: 36px;
    color: #333;
    max-width: 90%;
  }
  .question-buttons {
    display: flex;
    gap: 20px;
  }
  .question-btn {
    padding: 14px 32px;
    border-radius: 999px;
    background: #fff;
    color: #ff6b81;
    border: 2px solid #ff8fa3;
    font-size: 1.05rem;
    font-family: inherit;
    cursor: pointer;
    transition: all .15s ease;
  }
  .question-btn:hover {
    background: linear-gradient(135deg, #ff8fa3, #ff6b81);
    color: #fff;
    transform: translateY(-2px);
  }

  /* 화면 4: 사진 + 축하 문구 */
  #screen-final {
    padding: 32px 16px;
    gap: 20px;
  }
  .photo-block {
    width: min(94vw, 720px);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .photo-row {
    width: 100%;
    overflow: hidden;
  }
  .photo-row-inner {
    display: flex;
    gap: 6px;
    width: max-content;
    animation: marquee-left 32s linear infinite;
  }
  @keyframes marquee-left {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .photo-row-inner { animation: none; }
  }
  .photo-tile {
    width: clamp(56px, 18vw, 132px);
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    overflow: hidden;
    flex-shrink: 0;
    background: transparent;
  }
  .photo-tile.placeholder {
    background: linear-gradient(135deg, #ffb3c1, #ff6b81);
  }
  .photo-tile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  #final-text {
    background: rgba(255, 255, 255, 0.9);
    padding: 18px 22px;
    border-radius: 18px;
    max-width: 90%;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
  }
  #final-text .line1 {
    font-family: 'Do Hyeon', sans-serif;
    color: #ff4d6d;
    font-size: clamp(1.1rem, 4vw, 1.6rem);
    margin: 0 0 6px;
  }
  #final-text .line2 {
    font-family: 'Do Hyeon', sans-serif;
    color: #ff4d6d;
    font-size: clamp(0.95rem, 3.2vw, 1.25rem);
    margin: 0 0 8px;
  }
  #final-text .line3 {
    font-size: clamp(0.7rem, 2.4vw, 0.9rem);
    color: #777;
    margin: 0;
  }
</style>
</head>
<body>

  <!-- 화면 1: 날짜 입력 -->
  <div id="screen-date" class="screen active">
    <h1>결혼 기념일을 적어주세요.</h1>
    <input type="date" id="date-input">
    <button class="btn-primary" id="submit-btn">제출</button>
  </div>

  <!-- 화면 2: 이름 확인 메시지 (3초 후 자동 전환) -->
  <div id="screen-transition" class="screen">
    <p id="transition-message"></p>
  </div>

  <!-- 화면 3: 질문 -->
  <div id="screen-question" class="screen">
    <h1>아직도 서로를 사랑하고 아끼십니까?</h1>
    <div class="question-buttons">
      <button class="question-btn" id="answer-yes-1">네</button>
      <button class="question-btn" id="answer-yes-2">그렇습니다!</button>
    </div>
  </div>

  <!-- 화면 4: 사진 + 축하 문구 -->
  <div id="screen-final" class="screen">
    <div class="photo-block">
      <div class="photo-row"><div class="photo-row-inner" id="row-top-1"></div></div>
      <div class="photo-row"><div class="photo-row-inner" id="row-top-2"></div></div>
    </div>
    <div id="final-text">
      <p class="line1">결혼 31주년!</p>
      <p class="line2">진심으로 축하합니다!</p>
      <p class="line3">권씨 37대손 형제자매 올림.</p>
    </div>
    <div class="photo-block">
      <div class="photo-row"><div class="photo-row-inner" id="row-bottom-1"></div></div>
      <div class="photo-row"><div class="photo-row-inner" id="row-bottom-2"></div></div>
    </div>
  </div>

<script>
  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // 화면 1 -> 화면 2
  document.getElementById('submit-btn').addEventListener('click', () => {
    const input = document.getElementById('date-input');
    const val = input.value; // 보통 "YYYY-MM-DD"

    // valueAsDate가 있으면 그걸 우선 사용 (브라우저가 실제로 해석한 날짜, UTC 기준)
    let digits = '';
    if (input.valueAsDate) {
      const d = input.valueAsDate;
      const y = d.getUTCFullYear();
      const m = String(d.getUTCMonth() + 1).padStart(2, '0');
      const day = String(d.getUTCDate()).padStart(2, '0');
      digits = `${y}${m}${day}`;
    } else if (val) {
      digits = val.replace(/\D/g, ''); // 숫자만 남기기 (구분자/공백/특수문자 방지)
    }

    if (!digits) {
      alert('날짜를 선택해주세요.');
      return;
    }

    const msgEl = document.getElementById('transition-message');
    const matched = (digits === '19950819' || digits === '08191995');
    msgEl.textContent = matched
      ? '권선종, 김시진님이시군요!'
      : '잠깐.... 잘못적은거죠...?ㅎㅎ....';

    show('screen-transition');
    setTimeout(() => {
      if (matched) {
        show('screen-question');
      } else {
        input.value = ''; // 다시 입력할 수 있도록 초기화
        show('screen-date');
      }
    }, 3000);
  });

  // 화면 3 -> 화면 4
  document.getElementById('answer-yes-1').addEventListener('click', () => {
    show('screen-final');
    buildFinalPhotos();
  });
  document.getElementById('answer-yes-2').addEventListener('click', () => {
    show('screen-final');
    buildFinalPhotos();
  });

  // images 폴더에 photo1.jpg ~ photo{PHOTO_COUNT}.jpg 형식으로 사진을 넣어주세요.
  // 사진이 이 숫자보다 적으면 반복해서 채워지고, 아직 없으면 분홍색 타일로 대체됩니다.
  // (위 2줄 + 아래 2줄, 한 줄당 5장씩 총 20장: photo1~5 / 6~10 / 11~15 / 16~20)
  const PHOTO_COUNT = 20;

  let finalBuilt = false;
  function buildFinalPhotos() {
    if (finalBuilt) return;
    finalBuilt = true;

    buildPhotoRow('row-top-1', 0);
    buildPhotoRow('row-top-2', 5);
    buildPhotoRow('row-bottom-1', 10);
    buildPhotoRow('row-bottom-2', 15);
  }

  function buildPhotoRow(containerId, startIndex) {
    const container = document.getElementById(containerId);
    const files = [];
    for (let i = 0; i < 5; i++) {
      const n = ((startIndex + i) % PHOTO_COUNT) + 1;
      files.push(`images/photo${n}.jpg`);
    }
    // 자연스러운 무한 루프를 위해 5장을 통째로 한 번 더 이어붙임
    files.concat(files).forEach(src => {
      const tile = document.createElement('div');
      tile.className = 'photo-tile';
      const img = document.createElement('img');
      img.src = src;
      img.alt = '추억 사진';
      img.onerror = function () {
        this.remove();
        tile.classList.add('placeholder');
      };
      tile.appendChild(img);
      container.appendChild(tile);
    });
  }
</script>
</body>
</html>
